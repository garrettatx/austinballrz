<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Softball stitching pattern tile — repeatable -->
  <defs>
    <pattern id="stitch" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Main arc -->
      <path d="M-20,100 Q50,20 100,100 T220,100" fill="none" stroke="#42168A" stroke-width="2" opacity="0.08"/>
      <!-- Cross stitches -->
      <line x1="25" y1="50" x2="35" y2="60" stroke="#42168A" stroke-width="1.5" opacity="0.06"/>
      <line x1="55" y1="35" x2="65" y2="45" stroke="#42168A" stroke-width="1.5" opacity="0.06"/>
      <line x1="85" y1="30" x2="95" y2="40" stroke="#42168A" stroke-width="1.5" opacity="0.06"/>
      <line x1="115" y1="35" x2="125" y2="45" stroke="#42168A" stroke-width="1.5" opacity="0.06"/>
      <line x1="145" y1="50" x2="155" y2="60" stroke="#42168A" stroke-width="1.5" opacity="0.06"/>
      <line x1="175" y1="70" x2="185" y2="80" stroke="#42168A" stroke-width="1.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#stitch)"/>
</svg>
